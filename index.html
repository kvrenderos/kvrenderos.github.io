<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>www.semita.sv - Control IoT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: Arial, sans-serif; }
        .card-custom { max-width: 480px; margin: 20px auto; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .display-distancia { font-size: 3rem; font-weight: bold; color: #0d6efd; }
    </style>
</head>
<body>

    <header class="text-center py-3 bg-light border-bottom mb-4">
        <h2 class="fw-bold text-secondary mb-0">www.semita.sv</h2>
        <small class="text-muted">Sistema IoT - Control de Giro con Sensor</small>
    </header>

    <div class="container text-center">
        <div class="card card-custom p-4 bg-white">
            <!-- Dominio y Conexión -->
            <h3 class="fw-bold text-secondary">www.semita.sv</h3>
            <button id="btnConectar" class="btn btn-success my-2 w-100 fw-bold">🟢 Sistema Wi-Fi Conectado</button>
            <hr>

            <!-- Escudo del FC Barcelona -->
            <div class="my-2">
                <img src="https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg" alt="FC Barcelona" width="80">
            </div>

            <!-- Telemetría en tiempo real -->
            <div class="my-3">
                <h5>DISTANCIA</h5>
                <div id="valDistancia" class="display-distancia">-- cm</div>
                <p class="mb-0">Modo: <span id="txtModo" class="badge bg-success">AUTOMÁTICO</span></p>
                <p>Estado Motor: <span id="txtMotor" class="badge bg-dark">DETENIDO</span></p>
            </div>

            <!-- Conmutador de Modos -->
            <div class="d-flex justify-content-center gap-2 mb-3">
                <button onclick="cambiarModo('AUTOMATICO')" class="btn btn-outline-primary btn-sm">Modo Automático</button>
                <button onclick="cambiarModo('MANUAL')" class="btn btn-outline-warning btn-sm">Modo Manual</button>
            </div>

            <!-- Botones de Control Manual -->
            <div class="d-grid gap-2">
                <button onclick="enviarComandoMotor('IZQUIERDA')" class="btn btn-primary">IZQUIERDA</button>
                <button onclick="enviarComandoMotor('DERECHA')" class="btn btn-primary">DERECHA</button>
                <button onclick="enviarComandoMotor('DETENER')" class="btn btn-danger">DETENER</button>
            </div>
        </div>
    </div>

    <script>
        const apiUrl = "https://6ad813a395e98f36aef2ea16.mockapi.io/sistema/1";

        async function obtenerDatos() {
            try {
                let response = await fetch(apiUrl);
                let data = await response.json();
                
                document.getElementById('valDistancia').innerText = (data.distancia || "--") + " cm";
                if(data.motor) {
                    document.getElementById('txtMotor').innerText = data.motor;
                }
                if(data.modo) {
                    let badgeModo = document.getElementById('txtModo');
                    badgeModo.innerText = data.modo;
                    badgeModo.className = data.modo === 'MANUAL' ? 'badge bg-warning text-dark' : 'badge bg-success';
                }
            } catch (error) {
                console.error("Error al leer MockAPI:", error);
            }
        }

        async function cambiarModo(nuevoModo) {
            try {
                let response = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ modo: nuevoModo })
                });
                if (response.ok) {
                    document.getElementById('txtModo').innerText = nuevoModo;
                    document.getElementById('txtModo').className = nuevoModo === 'MANUAL' ? 'badge bg-warning text-dark' : 'badge bg-success';
                    console.log("Modo cambiado a:", nuevoModo);
                }
            } catch (error) {
                console.error("Error al cambiar modo:", error);
            }
        }

        async function enviarComandoMotor(accion) {
            try {
                // Al presionar un botón manual, asegurarnos de poner el sistema en MANUAL
                let response = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ motor: accion, modo: "MANUAL" })
                });
                if (response.ok) {
                    document.getElementById('txtMotor').innerText = accion;
                    document.getElementById('txtModo').innerText = "MANUAL";
                    document.getElementById('txtModo').className = "badge bg-warning text-dark";
                    console.log("Comando motor enviado:", accion);
                }
            } catch (error) {
                console.error("Error al enviar comando del motor:", error);
            }
        }

        // Consultar la API cada 2 segundos para refrescar la pantalla web
        setInterval(obtenerDatos, 2000);
    </script>
</body>
</html>
