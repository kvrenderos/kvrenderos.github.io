<script>
    // Tu enlace de MockAPI para el registro 1
    const apiUrl = "https://6ad813a395e98f36aef2ea16.mockapi.io/sistema/1";

    // 1. Cambiar el botón de conexión para indicar que ya está por Wi-Fi
    const btnConectar = document.getElementById('btnConectar');
    btnConectar.innerText = "🟢 Sistema Wi-Fi Conectado";
    btnConectar.classList.remove('btn-success');
    btnConectar.classList.add('btn-primary');

    // Cambiar estado visual a conectado de forma automática
    document.getElementById('txtModo').innerText = "AUTOMÁTICO / WEB";
    document.getElementById('txtModo').className = "badge bg-success";

    // 2. Función para LEER la distancia y el estado desde MockAPI (cada 2 segundos)
    async function obtenerDatos() {
        try {
            let response = await fetch(apiUrl);
            let data = await response.json();
            
            // Actualizar la distancia en pantalla
            document.getElementById('valDistancia').innerText = (data.distancia || "--") + " cm";
            
            // Actualizar el estado del motor en pantalla si viene en la API
            if(data.motor) {
                document.getElementById('txtMotor').innerText = data.motor;
            }
        } catch (error) {
            console.error("Error al leer MockAPI:", error);
        }
    }

    // 3. Función para ENVIAR comandos (Izquierda, Derecha, Detener, Modos) hacia MockAPI
    async function enviarComando(cmd) {
        try {
            let datosAEnviar = {};

            // Traducir los comandos de los botones de control manual o modos
            if (cmd === 'IZQUIERDA' || cmd === 'DERECHA' || cmd === 'DETENER') {
                datosAEnviar = { motor: cmd };
                document.getElementById('txtMotor').innerText = cmd;
            } 
            else if (cmd === 'MODO_AUTO') {
                datosAEnviar = { modo: "AUTOMÁTICO" };
                document.getElementById('txtModo').innerText = "AUTOMÁTICO";
                document.getElementById('txtModo').className = "badge bg-success";
            } 
            else if (cmd === 'MODO_MANUAL') {
                datosAEnviar = { modo: "MANUAL" };
                document.getElementById('txtModo').innerText = "MANUAL";
                document.getElementById('txtModo').className = "badge bg-warning text-dark";
            }

            // Hacer una petición PUT para actualizar el registro en la nube
            let response = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(datosAEnviar)
            });

            if (response.ok) {
                console.log("Comando enviado con éxito:", datosAEnviar);
            }
        } catch (error) {
            console.error("Error al enviar comando a MockAPI:", error);
            alert("No se pudo enviar el comando a la API.");
        }
    }

    // Ejecutar la lectura de datos automáticamente cada 2 segundos
    setInterval(obtenerDatos, 2000);
  </script>
