<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>semita.sv - Control Bluetooth</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: Arial, sans-serif; }
    .card-custom { max-width: 480px; margin: 20px auto; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .display-distancia { font-size: 3rem; font-weight: bold; color: #0d6efd; }
  </style>
</head>
<body>

  <header class="text-center py-3 bg-light border-bottom mb-4">
    <h2 class="fw-bold text-secondary mb-0">www.semita.sv</h2>
    <small class="text-muted">Sistema IoT - Control de Giro con Sensor</small>
</header>

  <div class="container text-center">
    <div class="card card-custom p-4 bg-white">
      <!-- Dominio y Conexión -->
      <h3 class="fw-bold text-secondary">www.semita.sv</h3>
      <button id="btnConectar" class="btn btn-success my-2 w-100 fw-bold">🔵 Conectar por Bluetooth</button>
      <hr>

      <!-- Escudo del FC Barcelona -->
      <div class="my-2">
        <img src="https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg" alt="FC Barcelona" width="80">
      </div>

      <!-- Telemetría en tiempo real -->
      <div class="my-3">
        <h5>DISTANCIA</h5>
        <div id="valDistancia" class="display-distancia">-- cm</div>
        <p class="mb-0">Modo: <span id="txtModo" class="badge bg-secondary">DESCONECTADO</span></p>
        <p>Estado Motor: <span id="txtMotor" class="badge bg-dark">DETENIDO</span></p>
      </div>

      <!-- Conmutador de Modos -->
      <div class="d-flex justify-content-center gap-2 mb-3">
        <button onclick="enviarComando('MODO_AUTO')" class="btn btn-outline-primary btn-sm">Modo Automático</button>
        <button onclick="enviarComando('MODO_MANUAL')" class="btn btn-outline-warning btn-sm">Modo Manual</button>
      </div>

      <!-- Botones de Control Manual -->
      <div class="d-grid gap-2">
        <button onclick="enviarComando('IZQUIERDA')" class="btn btn-primary">IZQUIERDA</button>
        <button onclick="enviarComando('DERECHA')" class="btn btn-primary">DERECHA</button>
        <button onclick="enviarComando('DETENER')" class="btn btn-danger">DETENER</button>
      </div>
    </div>
  </div>

  <script>
    const serviceUuid = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const rxUuid = "19b10001-e8f2-537e-4f6c-d104768a1214";
    const txUuid = "19b10002-e8f2-537e-4f6c-d104768a1214";

    let rxCharacteristic;
    let bluetoothDevice;

    document.getElementById('btnConectar').addEventListener('click', async () => {
      try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'semita.sv-BLE' }],
          optionalServices: [serviceUuid]
        });

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(serviceUuid);
        rxCharacteristic = await service.getCharacteristic(rxUuid);
        const txCharacteristic = await service.getCharacteristic(txUuid);

        await txCharacteristic.startNotifications();
        txCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
          const decoder = new TextDecoder('utf-8');
          const data = JSON.parse(decoder.decode(event.target.value));
          
          document.getElementById('valDistancia').innerText = data.distancia + " cm";
          document.getElementById('txtModo').innerText = data.modo;
          document.getElementById('txtMotor').innerText = data.motor;
        });

        alert("¡Conectado exitosamente por Bluetooth a semita.sv!");
      } catch (error) {
        console.error("Error al conectar Bluetooth:", error);
      }
    });

    async function enviarComando(cmd) {
      if (!rxCharacteristic) {
        alert("Primero conecta el dispositivo Bluetooth.");
        return;
      }
      const encoder = new TextEncoder();
      await rxCharacteristic.writeValue(encoder.encode(cmd));
    }
  </script>
</body>
</html>
